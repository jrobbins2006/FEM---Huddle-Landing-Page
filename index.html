<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Huddle landing page with single introductory section</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="logo-hero">
  <header>
    <div class="logo-container">
      <img class="logo-image" src="./images/logo.svg" alt="Huddle logo" srcset="">
    </div>
  </header>
  <div class="hero-image-container">
    <img class="hero-image" src="./images/illustration-mockups.svg" alt="Huddle markups" srcset="">
  </div>
</div>
  <div class="right-side">
  <div class="text">
    <h1 class="text-heading text-2">Build The Community Your Fans Will Love</h1>
    <p class="text-p text-5">
  Huddle re-imagines the way we build communities. You have a voice, but so does your audience. 
  Create connections with your users as you engage in genuine discussion. 
    </p>
  <button class="text-btn">Register</button>


  </div> <!--heading text and button-->



</div><!--end of right side-->
  
  </div> <!--end of container div-->
        <footer>
     <i  class="icon fa-brands fa-facebook-f"></i>
     <i  class="icon fa-brands fa-twitter"></i>
     <i  class="icon fa-brands fa-instagram"></i>
  </footer>

</body>
</html>
